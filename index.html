
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNFILTERED 🔥</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b18;color:#fff;font-family:Arial,sans-serif;padding:20px}
main{max-width:650px;margin:auto}
h1{font-size:46px;letter-spacing:2px;color:#e6a3ff;margin-bottom:4px}
p{color:#d2c4dc;line-height:1.5}
.card{background:#21182b;border:1px solid #594168;border-radius:16px;padding:20px;margin:18px 0}
textarea,button{font:inherit;width:100%;border-radius:10px;padding:14px;margin:7px 0}
textarea{background:#120d19;color:white;border:1px solid #594168;min-height:110px}
button{background:linear-gradient(100deg,#e6a3ff,#f6d87b);color:#211629;font-weight:bold;border:0;cursor:pointer}
.secondary{background:#392744;color:white}
label{display:block;padding:9px 0}
.result{background:#392744;padding:14px;margin:10px 0;border-radius:10px;white-space:pre-line}
small{color:#bdaac9}
#error{color:#ffaaaa}
</style>
</head>
<body>
<main>
<h1>UNFILTERED.</h1>
<p>🔥 THE GROUP CHAT HAS ENTERED THE GAME.</p>
<div class="card">
<h2>Who's getting exposed?</h2>
<p>Add your crew. Friendship is optional. Honesty is brutal.</p>
<textarea id="names" placeholder="Enter one name per line"></textarea>
<small>Enter 2 to 12 names.</small>
</div>
<div class="card">
<h2>Choose your challenge</h2>
<label><input type="radio" name="game" value="famous" checked> Most likely to become famous</label>
<label><input type="radio" name="game" value="redflag"> Biggest walking red flag</label>
<label><input type="radio" name="game" value="drama"> Most likely to start drama</label>
<label><input type="radio" name="game" value="mastermind"> Secretly the mastermind</label>
<label><input type="radio" name="game" value="arrested"> First arrested in a comedy movie</label>
<label><input type="radio" name="game" value="disappear"> Most likely to disappear and start a new life</label>
<button onclick="play()">🔥 REVEAL THE DAMAGE</button>
<p id="error"></p>
</div>
<div class="card" id="results" hidden>
<h2 id="title"></h2>
<div id="list"></div>
<button onclick="share()">↗ SHARE RESULTS</button>
<button class="secondary" onclick="play()">PLAY AGAIN</button>
</div>
<p><small>UNFILTERED. Rankings are random. Don't sue your friends.</small></p>
</main>
<script>
const games={
famous:["Most likely to become famous",[
"Famous for all the wrong reasons.",
"Practicing their acceptance speech in the mirror.",
"One viral clip away from needing a PR team."
]],
redflag:["Biggest walking red flag",[
"The warning label needs a warning label.",
"Their dating history needs a documentary.",
"Somehow both the problem and the plot twist."
]],
drama:["Most likely to start drama",[
"Could turn a grocery run into a season finale.",
"Would start a group chat just to leak it.",
"Brings popcorn to a problem they created."
]],
mastermind:["Secretly the mastermind",[
"Has everyone's secrets in a spreadsheet.",
"Three steps ahead and somehow still late.",
"Quietly running this group like a tiny corporation."
]],
arrested:["First arrested in a comedy movie",[
"Would say 'I can explain' while holding the evidence.",
"The plot starts with them saying 'watch this.'",
"Would livestream the escape plan."
]],
disappear:["Most likely to disappear and start a new life",[
"New name, new haircut, new country by Thursday.",
"Could vanish for six months and return with a llama.",
"One inconvenience away from moving to a cabin."
]]
};
let output="";
function play(){
const names=document.getElementById("names").value
.split("\n").map(n=>n.trim()).filter(Boolean);
const error=document.getElementById("error");
if(names.length<2||names.length>12){
error.textContent="Please enter between 2 and 12 names.";
return;
}
error.textContent="";
const key=document.querySelector('input[name="game"]:checked').value;
const game=games[key];
const shuffled=[...names].sort(()=>Math.random()-.5);
document.getElementById("title").textContent=game[0];
const list=document.getElementById("list");
list.replaceChildren();
output="UNFILTERED 🔥\n"+game[0]+"\n\n";
shuffled.forEach((name,i)=>{
const roast=game[1][Math.floor(Math.random()*game[1].length)];
output+=(i+1)+". "+name+" - "+roast+"\n";
const item=document.createElement("div");
item.className="result";
item.textContent="#"+(i+1)+" "+name+
(i===0?" 👑":"")+"\n"+roast;
list.appendChild(item);
});
document.getElementById("results").hidden=false;
document.getElementById("results").scrollIntoView({behavior:"smooth"});
}
async function share(){
try{
if(navigator.share){
await navigator.share({title:"UNFILTERED",text:output});
}else{
await navigator.clipboard.writeText(output);
alert("Results copied! Paste them into your group chat.");
}
}catch(e){
if(e.name!=="AbortError"){
prompt("Copy your results below:",output);
}
}
}
</script>
</body>
</html>
