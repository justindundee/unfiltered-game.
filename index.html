<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d19">
<title>UNFILTERED 🔥 | The Roast Game</title>
<style>
:root {
  --bg: #100d19;
  --panel: #1b1528;
  --gold: #ffd166;
  --pink: #ff4f91;
  --text: #f8f5ff;
  --muted: #b8afc9;
  --line: #3b2c50;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #302044 0%, var(--bg) 55%);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}
main { width: min(760px, 100%); margin: auto; padding: 24px 16px 48px; }
header { text-align: center; padding: 14px 0 20px; }
.logo {
  font-size: clamp(2.8rem, 12vw, 5.2rem);
  font-weight: 1000;
  letter-spacing: .07em;
  line-height: 1;
  color: var(--gold);
  text-shadow: 3px 3px 0 #8c376d, 0 0 30px #ff4f9140;
}
.tag { color: var(--muted); margin-top: 12px; }
.panel {
  background: #1b1528ed;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 12px 40px #0003;
}
h2 { font-size: 1.08rem; margin: 0 0 14px; color: var(--gold); }
label { display: block; font-weight: 750; margin: 14px 0 8px; }
textarea, input {
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid #514064;
  border-radius: 12px;
  padding: 13px;
}
textarea { width: 100%; min-height: 130px; resize: vertical; }
.small { color: var(--muted); font-size: .88rem; margin-top: 7px; }
.categories { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.category {
  display: flex;
  align-items: center;
  gap: 9px;
  background: #241b34;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
}
.category input { width: auto; accent-color: var(--pink); }
button {
  border: 0;
  border-radius: 13px;
  padding: 14px 16px;
  font: inherit;
  font-weight: 850;
  cursor: pointer;
}
button:active { transform: scale(.98); }
.primary {
  width: 100%;
  background: linear-gradient(100deg, var(--gold), #ffad73);
  color: #211328;
  font-size: 1.05rem;
  margin-top: 16px;
}
.secondary { background: #30233f; color: var(--text); border: 1px solid #514064; }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
#error { color: #ff8db4; font-weight: 700; margin-top: 10px; }
#results { display: none; }
.result { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.result:last-child { border-bottom: 0; }
.rank {
  flex: 0 0 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: #38233e;
  color: var(--gold);
  font-weight: 950;
}
.name { font-weight: 900; color: white; }
.roast { color: #e6dff1; margin-top: 3px; line-height: 1.45; }
#resultTitle { font-size: 1.5rem; font-weight: 950; color: var(--gold); margin-bottom: 5px; }
#roundInfo { color: var(--muted); font-size: .9rem; }
footer { text-align: center; color: #827790; font-size: .8rem; padding-top: 16px; }
@media(max-width: 420px) {
  .panel { padding: 16px; }
  .categories, .actions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">UNFILTERED</div>
  <div class="tag">🔥 No filters. No mercy. Just friends.</div>
</header>

<section class="panel">
  <h2>01 / BUILD YOUR CHAOS</h2>
  <label for="names">Player names</label>
  <textarea id="names" placeholder="Juu&#10;Alex&#10;Sam"></textarea>
  <div class="small">Enter 2–12 players, one name per line.</div>

  <label>Choose your flavor</label>
  <div class="categories">
    <label class="category"><input type="radio" name="game" value="famous" checked> 🌟 Main Character</label>
    <label class="category"><input type="radio" name="game" value="redflag"> 🚩 Red Flag Energy</label>
    <label class="category"><input type="radio" name="game" value="drama"> 🎭 Certified Drama</label>
    <label class="category"><input type="radio" name="game" value="mastermind"> 🧠 Tiny Evil Genius</label>
    <label class="category"><input type="radio" name="game" value="arrested"> 🚔 Most Likely Arrested</label>
    <label class="category"><input type="radio" name="game" value="disappear"> 🕵️ Would Vanish First</label>
  </div>

  <button class="primary" id="playButton" type="button">REVEAL THE DAMAGE 🔥</button>
  <div id="error" role="alert" aria-live="polite"></div>
</section>

<section class="panel" id="results" aria-live="polite">
  <div id="resultTitle">THE DAMAGE</div>
  <div id="roundInfo"></div>
  <div id="list"></div>
  <div class="actions">
    <button class="secondary" id="newRound" type="button">🎲 New Round</button>
    <button class="secondary" id="shareText" type="button">📲 Share Results</button>
    <button class="secondary" id="copyText" type="button">📋 Copy Results</button>
    <button class="secondary" id="resetGame" type="button">↻ Start Over</button>
  </div>
  <div class="small" id="shareStatus" aria-live="polite"></div>
</section>

<footer>UNFILTERED • Play hard, roast responsibly.</footer>
</main>

<script>
"use strict";

const games = {
  famous: {
    title: "🌟 MAIN CHARACTER ENERGY",
    roasts: [
      "Would wave to a crowd that was waving at someone else.",
      "Has a personal soundtrack and expects everyone to hear it.",
      "Turns a quick story into a three-part documentary.",
      "Practices arguments in the shower and still loses.",
      "Would autograph their own forehead if a pen was handy.",
      "Treats every group photo like a campaign poster.",
      "Could make a minor inconvenience about their personal journey.",
      "Says 'long story short' then starts at childhood.",
      "Has the confidence of someone who has never read the comments.",
      "Would thank the Academy for surviving Monday.",
      "Enters a room like the Wi-Fi just got stronger.",
      "Thinks the group chat is their personal podcast.",
      "Could turn ordering lunch into a season finale.",
      "Has a dramatic pause professionally installed.",
      "Would put 'iconic' in their own biography.",
      "Thinks being five minutes late is a grand entrance.",
      "Their camera roll is 80% pictures of themselves.",
      "Would make a documentary about finding their keys.",
      "Has main-character confidence and side-quest planning.",
      "Could turn a sneeze into a press conference."
    ]
  },

  redflag: {
    title: "🚩 RED FLAG ENERGY",
    roasts: [
      "Says 'I'm brutally honest' right before being rude.",
      "Texts 'we need to talk' then disappears for six hours.",
      "Their apology comes with terms and conditions.",
      "Calls every ex 'crazy' like they weren't in the relationship.",
      "Says they're chill, then audits your punctuation.",
      "Treats a read receipt like a federal investigation.",
      "Would flirt with a traffic cone if it gave attention.",
      "Has more mixed signals than a broken airport sign.",
      "Says 'no drama' while carrying a full drama subscription.",
      "Thinks jealousy is a love language.",
      "Leaves people on read, then asks why they got distant.",
      "Has a type, and apparently it's poor decisions.",
      "Says 'trust me' with the energy of a suspicious email.",
      "Would start an argument and ask for a calm conversation.",
      "Their standards are high; their own behavior is buffering.",
      "Uses 'I'm just like that' as a software update refusal.",
      "Can spot everyone else's red flags through rose-colored glasses.",
      "Sends 'k' and expects a peaceful evening.",
      "Has commitment issues with plans made yesterday.",
      "Calls it being mysterious; everyone else calls it bad communication."
    ]
  },

  drama: {
    title: "🎭 CERTIFIED DRAMA",
    roasts: [
      "Could start a feud in an empty room.",
      "Says 'I'm not making a scene' while selecting the soundtrack.",
      "Has never met a small problem they couldn't give a trilogy.",
      "Their story has more plot twists than a crime series.",
      "Would subtweet someone sitting directly beside them.",
      "Can turn 'okay' into a five-alarm emotional event.",
      "Brings receipts to conversations that haven't happened yet.",
      "Their favorite hobby is saying 'interesting...' ominously.",
      "Could make a delayed pizza delivery a betrayal arc.",
      "Says 'I'm done' with enough sequels for a franchise.",
      "Treats gossip like breaking international news.",
      "Can detect a vibe shift from three zip codes away.",
      "Their group chat has a writers' room.",
      "Would call an emergency meeting over a weird emoji.",
      "Says 'not to be dramatic' like a warning label.",
      "Has a season finale every Thursday.",
      "Can make a silent treatment louder than a concert.",
      "Knows everyone's business and calls it community service.",
      "Their life needs a recap before every episode.",
      "Would turn a missed call into a conspiracy board."
    ]
  },

  mastermind: {
    title: "🧠 TINY EVIL GENIUS",
    roasts: [
      "Has a five-year plan and forgot what day it is.",
      "Could outsmart a smart fridge, then lose to a jar lid.",
      "Says 'I have a system' while everything is on fire.",
      "Would scheme for three weeks to avoid one awkward text.",
      "Has the confidence of a chess grandmaster and the strategy of a pigeon.",
      "Can plan everyone else's life except their own.",
      "Thinks three steps ahead, directly into a wall.",
      "Would make a spreadsheet for a spontaneous decision.",
      "Has backup plans for plans that never existed.",
      "Could manipulate a vending machine into keeping the change.",
      "Says 'watch this' before a preventable disaster.",
      "Their master plan depends on everyone forgetting yesterday.",
      "Can read a room but not the instructions.",
      "Has suspiciously detailed answers to questions nobody asked.",
      "Would schedule an unplanned accident.",
      "Could run a heist but forget the getaway snacks.",
      "Has genius ideas at 2 a.m. and zero evidence by breakfast.",
      "Thinks they're playing 4D chess; it's a board game café.",
      "Could turn a simple task into a six-stage operation.",
      "Is somehow both the mastermind and the reason it failed."
    ]
  },

  arrested: {
    title: "🚔 MOST LIKELY ARRESTED",
    roasts: [
      "Would ask the officer if this can go on their record as a funny story.",
      "Looks guilty while doing absolutely nothing.",
      "Would try to talk their way out of a parking ticket and confess to three other things.",
      "Would say 'technically...' at the worst possible moment.",
      "Has the energy of someone who knows a guy who knows a guy.",
      "Would ask for a lawyer, then immediately overshare.",
      "Could get questioned for a crime they learned about five minutes ago.",
      "Would bring snacks to their own interrogation.",
      "Would mistake a serious warning for a customer-service survey.",
      "Their alibi begins with 'okay, so, funny story.'",
      "Would ask if the handcuffs come in different sizes.",
      "Could get caught in a lie while telling the truth.",
      "Would try to make the security camera laugh.",
      "Has a face that says 'I can explain' before anyone asks.",
      "Would ask the judge if they can appeal the vibe.",
      "Would narrate the whole situation like a reality show.",
      "Would accidentally incriminate themselves in a group text.",
      "Would bring a loyalty card to the courthouse.",
      "Would ask if community service includes a lunch break.",
      "Would say 'for the record' and make the record much worse."
    ]
  },

  disappear: {
    title: "🕵️ WOULD VANISH FIRST",
    roasts: [
      "Leaves the party without saying goodbye and becomes a local legend.",
      "Could disappear from a group chat while actively typing.",
      "Has three social accounts and nobody knows which one is real.",
      "Would move cities because someone waved at them twice.",
      "Treats replying to a text like a long-term project.",
      "Could go off-grid and still forget to cancel a subscription.",
      "Says 'I'm on my way' from a location they won't disclose.",
      "Would vanish for six months and return asking what's for dinner.",
      "Their phone is always on 2% and somehow still unreachable.",
      "Could hide in plain sight behind a vague Instagram story.",
      "Has mastered the art of leaving before the bill arrives.",
      "Would ghost a party they personally organized.",
      "Can be online all day and unreachable by everyone.",
      "Would change their name to avoid an awkward conversation.",
      "Leaves messages on delivered like it's a lifestyle choice.",
      "Could vanish from a photo while standing in the middle.",
      "Their location is either 'five minutes away' or classified.",
      "Would start a new life because their coffee order got remembered.",
      "Says 'brb' and enters another timeline.",
      "Could disappear during a headcount and still be holding the clipboard."
    ]
  }
};

let recentRoasts = {};
let lastGameKey = "";
let output = "";

function shuffle(items) {
  const result = [...items];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function play(forceNew = false) {
  const error = document.getElementById("error");
  const status = document.getElementById("shareStatus");

  error.textContent = "";
  status.textContent = "";

  const names = document.getElementById("names").value
    .split(/\n/)
    .map(name => name.trim())
    .filter(Boolean);

  if (names.length < 2 || names.length > 12) {
    error.textContent = "Enter between 2 and 12 player names.";
    return;
  }

  const normalized = names.map(name => name.toLowerCase());

  if (new Set(normalized).size !== normalized.length) {
    error.textContent = "Each player needs a unique name or nickname.";
    return;
  }

  const selected = document.querySelector('input[name="game"]:checked');

  if (!selected || !games[selected.value]) {
    error.textContent = "Choose a game category.";
    return;
  }

  let key = selected.value;

  if (forceNew && key === lastGameKey) {
    const otherKeys = Object.keys(games).filter(k => k !== lastGameKey);
    key = otherKeys[Math.floor(Math.random() * otherKeys.length)];

    const radio = document.querySelector(
      'input[name="game"][value="' + key + '"]'
    );

    if (radio) radio.checked = true;
  }

  const game = games[key];
  const players = shuffle(names);

  if (!recentRoasts[key]) recentRoasts[key] = [];

  let available = game.roasts.filter(
    roast => !recentRoasts[key].includes(roast)
  );

  if (available.length < players.length) {
    recentRoasts[key] = [];
    available = [...game.roasts];
  }

  const roasts = shuffle(available).slice(0, players.length);

  recentRoasts[key].push(...roasts);
  recentRoasts[key] = recentRoasts[key].slice(-16);

  const list = document.getElementById("list");
  list.replaceChildren();

  document.getElementById("resultTitle").textContent = game.title;
  document.getElementById("roundInfo").textContent =
    players.length + " players • " +
    players.length + " different roasts";

  output = "UNFILTERED 🔥\n" + game.title + "\n\n";

  players.forEach((name, index) => {
    output += (index + 1) + ". " + name + ": " +
      roasts[index] + "\n";

    const item = document.createElement("div");
    item.className = "result";

    const rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = "#" + (index + 1);

    const body = document.createElement("div");

    const player = document.createElement("div");
    player.className = "name";
    player.textContent = name;

    const roast = document.createElement("div");
    roast.className = "roast";
    roast.textContent = roasts[index];

    body.append(player, roast);
    item.append(rank, body);
    list.append(item);
  });

  lastGameKey = key;

  document.getElementById("results").style.display = "block";
  document.getElementById("results").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

async function copyOutput() {
  const status = document.getElementById("shareStatus");

  if (!output) {
    status.textContent = "Reveal the damage first.";
    return;
  }

  try {
    await navigator.clipboard.writeText(output);
    status.textContent = "Copied! Drop it in the group chat. 🔥";
  } catch (error) {
    const field = document.createElement("textarea");
    field.value = output;
    field.style.position = "fixed";
    field.style.opacity = "0";

    document.body.append(field);
    field.select();

    const copied = document.execCommand("copy");
    field.remove();

    status.textContent = copied
      ? "Copied! Drop it in the group chat. 🔥"
      : "Copy didn't work here. Select the results text and copy it.";
  }
}

async function shareOutput() {
  const status = document.getElementById("shareStatus");

  if (!output) {
    status.textContent = "Reveal the damage first.";
    return;
  }

  if (navigator.share) {
    try {
      await navigator.share({
        title: "UNFILTERED 🔥",
        text: output,
        url: location.href
      });
    } catch (error) {
      if (error.name !== "AbortError") {
        status.textContent = "Sharing isn't available here. Try Copy Results.";
      }
    }
  } else {
    await copyOutput();
  }
}

function resetGame() {
  document.getElementById("names").value = "";
  document.getElementById("error").textContent = "";
  document.getElementById("shareStatus").textContent = "";
  document.getElementById("results").style.display = "none";
  document.getElementById("names").focus();
}

document.getElementById("playButton")
  .addEventListener("click", () => play(false));

document.getElementById("newRound")
  .addEventListener("click", () => play(true));

document.getElementById("shareText")
  .addEventListener("click", shareOutput);

document.getElementById("copyText")
  .addEventListener("click", copyOutput);

document.getElementById("resetGame")
  .addEventListener("click", resetGame);
</script>
</body>
</html>
